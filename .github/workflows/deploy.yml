name: Deploy

# Runs after the CI workflow succeeds on the default branch, then SSHes into
# the Contabo server and rebuilds the stack. Deploying only after green CI means
# a broken build never reaches production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'master')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_SSH_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git reset --hard "origin/${{ github.event.workflow_run.head_branch }}"
            bash deploy/deploy.sh

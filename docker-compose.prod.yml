# ─────────────────────────────────────────────────────────────────────────────
# SkyCarWash – production stack (single server, single origin)
#
# Usage on the server:
#   cp .env.example .env      # then edit secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The frontend container is the only one publishing a public port (80). It
# serves the SPA and proxies /api and /ws to the backend over the internal
# Docker network. Postgres is never exposed to the host.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skycarwash}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skycarwash}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port published — reachable only inside the compose network.

  # ── Spring Boot backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skycarwash}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://161.97.183.139}
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    # Bind only to loopback on the host for debugging; not publicly exposed.
    ports:
      - "127.0.0.1:8080:8080"

  # ── Vue 3 frontend (nginx) — public entry point ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""   # same-origin: /api and /ws are proxied by nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Override the image's default.conf with the proxying prod config.
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  postgres_data:

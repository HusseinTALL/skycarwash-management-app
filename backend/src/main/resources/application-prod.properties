# ============================================================
# SkyCarWash – Production Profile Overrides
# Applied when SPRING_PROFILES_ACTIVE=prod
# ============================================================

# --- Reduced logging verbosity in production ---
logging.level.com.skycarwash=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
spring.jpa.show-sql=false

# --- Actuator: also expose metrics in prod for monitoring ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- HikariCP: tuned for production load ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

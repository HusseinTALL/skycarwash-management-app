# ============================================================
# SkyCarWash – Application Configuration
# Override sensitive values via environment variables in prod
# ============================================================

spring.application.name=skycarwash-backend
server.port=8080

# --- Database (Supabase / PostgreSQL) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/skycarwash}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long-secret}
jwt.expiration.manager=604800
jwt.expiration.employee=43200
jwt.expiration.partner=604800

# --- CORS (update to real frontend URL in prod) ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:3000}

# --- HikariCP connection pool ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- Actuator (health check for Railway/Render probes) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# --- Logging ---
logging.level.com.skycarwash=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================================
# SkyCarWash – Application Configuration
# Override sensitive values via environment variables in prod
# ============================================================

spring.application.name=skycarwash-backend
server.port=8080

# --- Database (Supabase / PostgreSQL) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/skycarwash}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
jwt.secret=${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long-secret}
jwt.expiration.manager=604800     # 7 days in seconds
jwt.expiration.employee=43200     # 12 hours in seconds
jwt.expiration.partner=604800     # 7 days in seconds

# --- CORS (update to real frontend URL in prod) ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Logging ---
logging.level.com.skycarwash=DEBUG
logging.level.org.springframework.security=INFO
